<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmanand Sports Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
</script>
<!-- <swiper-container class="mySwiper" navigation="true" pagination="true" css-mode=True etc>  -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="formcss.css">
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <link rel="shortcut icon" href="img/psa.png" type="image/x-icon">
    <meta name="keywords" content="Parmanand Sports Academy, Nashik, sports training,best sports academy in nashik,central location, coaching, sports academy,gymnastics,cricket,basketball,badminton,fencing,football,taekwondo,archery,skating,mallakhamba,dance,chess">
    <meta name="description" content="Parmanand Sports Academy is a leading sports training institute in Nashik, offering professional coaching in various sports.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Counter-Up/1.0.0/jquery.counterup.min.js"></script>
    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
</script>
<script type="text/javascript">
(function(){
  emailjs.init("2AzEwDZG5q8yTX8P3");
})();
</script>
</head>
<body>
    
    
    <section class="rcontainer">
        <div class="logo">
            <img src="img/psa.png" alt="logo">
        </div>
      <header>Registration Form</header>
      <form action="#" class="form" id="myForm">
        <div class="input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enter full name" required id="name" />
        </div>
        


        <div class="input-box">
          <label>Email Address</label>
          <input type="text" placeholder="Enter email address" required id="email"/>
        </div>

        <div class="column">
          <div class="input-box">
            <label>Phone Number</label>
            <input type="number" placeholder="Enter phone number" required id="no"/>
          </div>
          <div class="input-box">
            <label>Birth Date</label>
            <input type="date" placeholder="Enter birth date" required id="bod"/>
          </div>
        </div>
        <div class="sport-box">
          <h3>choose sport</h3>
          <div class="sport-option">
            <div class="sport">
              <input type="checkbox" id="check-gym" name="sport" checked  value="Gymnastics"/>
              <label for="check-male">Gymnastics</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-basket" name="sport" value="Basketball"/>
              <label for="check-basket">Basketball</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-cricket" name="sport"value="Cricket"/>
              <label for="check-cricket">Cricket</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-football" name="sport"  value="Football"/>
              <label for="check-football">Football</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-badminton" name="sport" value="Badminton"/>
              <label for="check-badminton">Badminton</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-archery" name="sport" value="Archery" />
              <label for="check-archery">Archery</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-dance" name="sport" value="Dance" />
              <label for="check-dance">Dance</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-malk" name="sport" value="Mallakhamb" />
              <label for="check-malk">Mallakhamb</label>
            </div>
            <div class="sport">
              <input type="checkbox" id="check-skating" name="sport" value="Skating" />
              <label for="check-skating">Skating</label>
            </div>
          </div>
        </div>
        
        </div>
        <button type="submit" onclick="showPopup()">Submit</button>
        <div class="popup" id="popupMessage">
          <img src="img/istockphoto-522855935-612x612.jpg" alt="">
          <h2>Thank you!</h2>
          <div class="popup-content">
            <p id="popupText"></p>
            <button class="close" onclick="closePopup()">OK</button>
            
          </div>
        </div>
      </form>
    
  </section>
    <script>
      document.getElementById("myForm").addEventListener("submit", function(event) {
  event.preventDefault(); // Prevent the form from submitting

  // Generate a unique user ID for EmailJS
  var userID = '2AzEwDZG5q8yTX8P3'; // Replace with your actual user ID from EmailJS

  var selectedSports = [];
  var checkboxes = document.querySelectorAll('input[name="sport"]:checked');
  checkboxes.forEach(function(checkbox) {
    selectedSports.push(checkbox.value);
  });

  // Gather the form data
  var templateParams = {
    from_name: document.getElementById("name").value,
    from_email: document.getElementById("email").value,
    from_phonenumber: document.getElementById("no").value,
    from_sport: selectedSports,
    date_of_birth: document.getElementById("bod").value
  };

  // Send the email using EmailJS
  emailjs.send('service_7z9eu1k', 'template_7dboqil', templateParams, userID)
    .then(function(response) {
      console.log('SUCCESS!', response.status, response.text);
      showPopup('your details has been successfully submitted!');
      document.getElementById("myForm").reset(); // Reset the form
    }, function(error) {
      console.log('FAILED...', error);
      showPopup();
    });
});

function showPopup(message) {
  var popup = document.getElementById('popupMessage');
  var popupText = document.getElementById('popupText');
  popupText.textContent = message;
  popup.style.display = 'block';
  popup.classList.add("open-popup");
}

function closePopup() {
  var popup = document.getElementById('popupMessage');
  popup.style.display = 'none';
  popup.classList.remove("open-popup");
}



    </script>
  </body>
</html>
