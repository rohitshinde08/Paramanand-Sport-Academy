version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: psa-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - psa-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa_admin -d psa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psa-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
      - ./seed-data:/app/seed-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psa-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - psa-network
    restart: always

volumes:
  postgres_data:

networks:
  psa-network:
    driver: bridge
